[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-voltage-boost-laplacian"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
]

[project.optional-dependencies]
# External comparison planners: python third_party/setup_external.py
external = ["pybind11>=2.10", "pyyaml"]

[tool.setuptools]
packages = ["Algorithms", "map_generation", "smoothness_metrics"]

[tool.setuptools.package-dir]
"map_generation"      = "Map Generation"
"smoothness_metrics"  = "Smoothness Metrics"
