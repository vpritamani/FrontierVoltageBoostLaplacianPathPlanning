[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-voltage-boost-laplacian"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
]

[tool.setuptools]
packages = ["Algorithms", "map_generation"]

[tool.setuptools.package-dir]
"map_generation" = "Map Generation"
